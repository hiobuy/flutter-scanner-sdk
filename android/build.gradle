group = "com.hiobuy.hiobuy_scanner"
version = "1.0-SNAPSHOT"

// No buildscript block on purpose: the Android Gradle Plugin and Kotlin
// versions come from the host app, which may be several releases older or newer
// than the example's, so this file must not pin either.

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

// Hosts can override with `ext.hiobuyCameraxVersion = "…"` in their root build.gradle.
def cameraxVersion = rootProject.ext.has("hiobuyCameraxVersion") ? rootProject.ext.get("hiobuyCameraxVersion") : "1.4.2"

android {
    namespace = "com.hiobuy.hiobuy_scanner"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    testOptions {
        unitTests.all {
            testLogging {
                events "passed", "skipped", "failed"
            }
        }
    }
}

dependencies {
    implementation("androidx.camera:camera-core:$cameraxVersion")
    implementation("androidx.camera:camera-camera2:$cameraxVersion")
    implementation("androidx.camera:camera-lifecycle:$cameraxVersion")
    implementation("androidx.concurrent:concurrent-futures:1.2.0")
    implementation("androidx.core:core:1.10.1")
    implementation("androidx.lifecycle:lifecycle-runtime:2.6.2")
    // Bundled model: works on devices without Google Play services.
    implementation("com.google.mlkit:barcode-scanning:17.3.0")

    testImplementation("junit:junit:4.13.2")
}
